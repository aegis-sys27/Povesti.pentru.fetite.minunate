<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Mea Magică 📚✨</title>
  <style>
    :root {
      --bg-color: #FFF9E6;
      --card-bg: #FFFFFF;
      --accent: #FF6B6B;
      --accent-blue: #4D96FF;
      --accent-green: #6BCB77;
      --text: #2C3E50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #FFE66D;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 2.2rem;
      color: #E056FD;
      text-shadow: 2px 2px #fff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 25px;
      flex: 1;
    }

    /* Grila de cărți */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .book-card {
      background: var(--card-bg);
      border-radius: 25px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 15px rgba(0,0,0,0.08);
      cursor: pointer;
      border: 5px solid #FFD93D;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .book-card:hover, .book-card:active {
      transform: scale(1.05);
      box-shadow: 0 12px 20px rgba(0,0,0,0.15);
      border-color: var(--accent);
    }

    .book-cover {
      width: 100%;
      height: 160px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .book-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 8px;
    }

    .book-badge {
      font-size: 0.85rem;
      background: #E8F0FE;
      color: #1A73E8;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    /* Modal / Viewer Răsfoire */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .reader-window {
      background: #FFF;
      width: 100%;
      max-width: 850px;
      height: 90vh;
      border-radius: 30px;
      border: 8px solid #4D96FF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .reader-header {
      padding: 15px 25px;
      background: #E8F0FE;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reader-header h2 {
      font-size: 1.4rem;
      color: #1A73E8;
    }

    .btn-close {
      background: var(--accent);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-content {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #FAF8F5;
    }

    .page-visual {
      font-size: 6rem;
      margin-bottom: 20px;
    }

    .page-text {
      font-size: 1.5rem;
      line-height: 1.6;
      max-width: 650px;
      color: #333;
    }

    /* Controale Audio Părinți */
    .audio-controls {
      background: #FFF0F5;
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      border-top: 3px dashed #FFB6C1;
    }

    .btn-voice {
      padding: 12px 25px;
      border-radius: 30px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: 0.1s transform;
    }

    .btn-voice:active {
      transform: scale(0.95);
    }

    .btn-mama {
      background: #FF85A1;
      color: white;
    }

    .btn-tata {
      background: #6BCB77;
      color: white;
    }

    /* Bare navigare pagini */
    .reader-nav {
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFF;
      border-top: 2px solid #EEE;
    }

    .btn-nav {
      background: #FFD93D;
      border: 3px solid #F4C430;
      color: #444;
      font-size: 1.5rem;
      padding: 12px 28px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: bold;
    }

    .page-number {
      font-size: 1.2rem;
      font-weight: bold;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <h1>Alege o poveste! 🧸📖</h1>
  </header>

  <div class="container">
    <div class="grid" id="books-grid"></div>
  </div>

  <!-- Fereastra de citit / rasfoit -->
  <div class="modal" id="reader-modal">
    <div class="reader-window">
      <div class="reader-header">
        <h2 id="modal-title">Titlu Poveste</h2>
        <button class="btn-close" onclick="closeReader()">✕</button>
      </div>

      <div class="page-content">
        <div class="page-visual" id="page-icon">🍕</div>
        <p class="page-text" id="page-text">Aici începe povestea...</p>
      </div>

      <!-- Butoane Voce Mama / Tata -->
      <div class="audio-controls">
        <button class="btn-voice btn-mama" onclick="playVoice('mama')">
          👩 Vocea Mamei
        </button>
        <button class="btn-voice btn-tata" onclick="playVoice('tata')">
          👨 Vocea Tatei
        </button>
      </div>

      <div class="reader-nav">
        <button class="btn-nav" onclick="changePage(-1)">⬅ Înapoi</button>
        <span class="page-number" id="page-counter">Pagina 1 / 3</span>
        <button class="btn-nav" onclick="changePage(1)">Înainte ➡</button>
      </div>
    </div>
  </div>

  <script>
    // Lista cartilor identificate
    const library = [
      {
        id: "conni_pizza",
        title: "Conni coace pizza",
        category: "Gătit & Joacă",
        color: "#FFE5B4",
        icon: "🍕",
        pages: [
          { icon: "👩‍🍳", text: "Astăzi Conni a decis să fie un bucătar priceput și să prepare cea mai gustoasă pizza de casă!" },
          { icon: "🍅", text: "Împreună punem sosul dulce de roșii, presărăm brânză multă și așezăm legumele preferate." },
          { icon: "😋", text: "La cuptor a crescut rumenă și caldă. Toată familia se așază fericită la masă. Ce poftă bună!" }
        ]
      },
      {
        id: "conni_bolnava",
        title: "Conni e bolnavă",
        category: "Sănătate & Îngrijire",
        color: "#E2F0D9",
        icon: "🩺",
        pages: [
          { icon: "🤒", text: "Conni simte că fruntea îi este fierbinte și gâtul o doare puțin. E vremea de odihnă în pătuț." },
          { icon: "👩‍⚕️", text: "Doctorul este foarte blând, o consultă și îi dă sfaturi bune pentru a prinde puteri repede." },
          { icon: "🍵", text: "Cu un ceai cald cu miere și multă grijă de la mama și tata, Conni zâmbește din nou!" }
        ]
      },
      {
        id: "lama_imparti",
        title: "Lama Lama, e vremea să împarți!",
        category: "Prietenie & Generozitate",
        color: "#D9E1F2",
        icon: "🦙",
        pages: [
          { icon: "🧸", text: "Micuțul Lama are jucării noi și frumoase, dar un prieten vine în vizită și vrea să se joace împreună." },
          { icon: "🤝", text: "La început e greu să împarți jucăria preferată, dar joaca în doi este de două ori mai veselă!" },
          { icon: "🎉", text: "Ce echipă minunată! Când împarți cu dragoste, toată lumea este fericită." }
        ]
      },
      {
        id: "conni_bicicleta",
        title: "Conni merge pe bicicletă",
        category: "Curaj & Mișcare",
        color: "#FFF2CC",
        icon: "🚲",
        pages: [
          { icon: "🚲", text: "Conni își pune casca de protecție pe cap. Astăzi exersează mersul pe două roți fără roți ajutătoare!" },
          { icon: "💪", text: "Chiar dacă la început se clatină puțin, Conni nu renunță și ține bine ghidonul drept." },
          { icon: "⭐", text: "Uraaa! Pedalează liberă prin parc. Cu puțin curaj și exercițiu a reușit!" }
        ]
      },
      {
        id: "ce_si_doreste_mama",
        title: "Ce-și dorește mama",
        category: "Iubire & Familie",
        color: "#FCE4D6",
        icon: "🐻",
        pages: [
          { icon: "🐻", text: "Micul ursuleț se întreabă ce i-ar aduce cel mai mult bucurie și căldură mamei sale dragi." },
          { icon: "💐", text: "O floare culeasă cu mânuțele lui sau o îmbrățișare strânsă, strânsă?" },
          { icon: "❤️", text: "Mămica zâmbește cu dragoste: cel mai frumos dar din lume ești chiar tu și zâmbetul tău!" }
        ]
      }
    ];

    let currentBook = null;
    let currentPageIndex = 0;
    let audioPlayer = new Audio();

    // Generare carti in pagina
    const grid = document.getElementById("books-grid");
    library.forEach((book, index) => {
      const card = document.createElement("div");
      card.className = "book-card";
      card.innerHTML = `
        <div class="book-cover" style="background:${book.color}">${book.icon}</div>
        <div class="book-title">${book.title}</div>
        <span class="book-badge">${book.category}</span>
      `;
      card.onclick = () => openBook(index);
      grid.appendChild(card);
    });

    function openBook(index) {
      currentBook = library[index];
      currentPageIndex = 0;
      document.getElementById("modal-title").innerText = currentBook.title;
      document.getElementById("reader-modal").classList.add("active");
      renderPage();
    }

    function closeReader() {
      document.getElementById("reader-modal").classList.remove("active");
      audioPlayer.pause();
    }

    function renderPage() {
      const page = currentBook.pages[currentPageIndex];
      document.getElementById("page-icon").innerText = page.icon;
      document.getElementById("page-text").innerText = page.text;
      document.getElementById("page-counter").innerText = `Pagina ${currentPageIndex + 1} / ${currentBook.pages.length}`;
      audioPlayer.pause();
    }

    function changePage(delta) {
      const newIndex = currentPageIndex + delta;
      if (newIndex >= 0 && newIndex < currentBook.pages.length) {
        currentPageIndex = newIndex;
        renderPage();
      }
    }

    // Functie pentru redarea vocii parintilor
    function playVoice(parent) {
      // Structura fisierelor: de ex. "audio/conni_pizza_mama_1.mp3"
      const audioPath = `audio/${currentBook.id}_${parent}_${currentPageIndex + 1}.mp3`;
      
      console.log(`Se redă: ${audioPath}`);
      audioPlayer.src = audioPath;
      
      audioPlayer.play().catch(e => {
        alert(`Fișierul audio "${audioPath}" nu a fost găsit încă.\n\nÎnregistrați vocea pe telefon/calculator și salvați-o în folderul 'audio' cu această denumire.`);
      });
    }
  </script>
</body>
</html>
